  <path d="M96 236 C96 220 120 214 150 214 L362 214 C392 214 416 220 416 236 C416 250 380 262 256 262 C132 262 96 250 96 236 Z" fill="#f6efe2"/>

  <!-- окуляри: два кола і перенісся -->
