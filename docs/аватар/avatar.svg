  <circle cx="316" cy="318" r="46" fill="none" stroke="#f6efe2" stroke-width="18"/>
  <path d="M242 314 C250 300 262 300 270 314" fill="none" stroke="#f6efe2" stroke-width="16" stroke-linecap="round"/>
  <!-- у правому склі — лупа: тайний гість дивиться уважно -->
