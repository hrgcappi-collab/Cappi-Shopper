      <stop offset="0" stop-color="#d9412a"/>
      <stop offset="1" stop-color="#8f1f14"/>
    </radialGradient>
  </defs>
  <!-- фон: теплий томатний, як соус на піці -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- капелюх: тулія і криси -->
  <path d="M150 214 C150 150 200 118 256 118 C312 118 362 150 362 214 L362 226 L150 226 Z" fill="#f6efe2"/>
