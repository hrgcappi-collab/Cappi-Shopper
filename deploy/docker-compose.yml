# Запуск:  docker compose -f deploy/docker-compose.yml up -d --build
services:
  cappi-shopper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cappi-shopper
    container_name: cappi-shopper
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: Europe/Kyiv
    volumes:
      # Стан на хості: api.env, ролі, незавершені й завершені перевірки.
      # Шлях від папки з цим файлом: ./data означало б deploy/data.
      - ../data:/root/.shopper
