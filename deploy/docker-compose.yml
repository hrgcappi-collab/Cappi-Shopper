# Запуск:  docker compose -f deploy/docker-compose.yml up -d --build
#
# Контейнер ізольований від сусідів: своя мережа (cappi-shopper_default —
# не deploy_default, де живе Core), жодних спільних томів, жодних портів
# назовні (Telegram опитується довгим полінгом), файлова система лише для
# читання, окрім стану в ~/.shopper. Усе, що знає про Core, — нічого.
name: cappi-shopper

services:
  cappi-shopper:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: cappi-shopper
    container_name: cappi-shopper
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      TZ: Europe/Kyiv
    ports:
      # HTTP API для розділу «Тайники» в Loopa. Лише localhost: назовні —
      # через nginx з TLS, коли Loopa підключиться. Без SHOPPER_API_TOKEN
      # в api.env сервер не стартує.
      - "127.0.0.1:8788:8788"
    volumes:
      # Стан на хості: api.env, ролі, незавершені й завершені перевірки.
      # Шлях від папки з цим файлом: ./data означало б deploy/data.
      - ../data:/root/.shopper
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Docker тут rootless: ліміт процесора cgroup не віддає (cpu.max відсутній),
    # тому лише пам'ять і кількість процесів.
    mem_limit: 256m
    pids_limit: 64
